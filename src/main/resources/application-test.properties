# Database configuration - using test database
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/${SPRING_APPLICATION_NAME:Paridhi-Portal-2025}?createDatabaseIfNotExist=true&ssl-mode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration - validate schema but allow for testing
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Test environment HikariCP settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# Test JWT settings
jwt.secret=${JWT_SECRET:test-jwt-secret-key-should-be-very-long-for-security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Test-specific security settings
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# Test-specific logging levels
logging.level.root=WARN
logging.level.com.megatronix.paridhi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Test caching settings
# spring.cache.type=caffeine
# spring.cache.cache-names=${CACHE_NAMES:events,users,teams,galleries}
# spring.cache.caffeine.spec=expireAfterWrite=10m,maximumSize=200,recordStats

# Test actuator settings
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,loggers
management.endpoint.health.show-details=ALWAYS

# Error handling in test
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always