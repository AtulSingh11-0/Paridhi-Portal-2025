# Database configuration
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST:localhost}:${PROD_DB_PORT:3306}/${SPRING_APPLICATION_NAME:Paridhi-Portal-2025}?createDatabaseIfNotExist=true&ssl-mode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${PROD_DB_USERNAME:root}
spring.datasource.password=${PROD_DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.hbm2ddl.auto.create_namespaces=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# Production-specific HikariCP settings
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.connection-timeout=20000

# Production-specific JWT settings
jwt.secret=${PROD_JWT_SECRET}
jwt.expiration=${PROD_JWT_EXPIRATION:86400000}

# Production-specific security settings
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Enable strict CSP in production
server.tomcat.additional-tld-skip-patterns=*.jar
server.tomcat.resource.allow-caching=true

# Production-specific logging
logging.level.root=WARN
logging.level.com.megatronix.paridhi=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# Production caching settings
spring.cache.caffeine.spec=expireAfterWrite=30m,maximumSize=500,recordStats

# Error handling in production
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Actuator security in production
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=WHEN_AUTHORIZED