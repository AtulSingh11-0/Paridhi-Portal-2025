spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application info
spring.application.name=${SPRING_APPLICATION_NAME}
info.app.version=@1.0@
info.app.description=Paridhi Portal 2025

# HikariCP Connection Pool - Common Configuration
spring.datasource.hikari.pool-name=ParidhiHikariPool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.leak-detection-threshold=60000

# Admin user setup
super-admin.default.email=${SUPER_ADMIN_EMAIL}
super-admin.default.password=${SUPER_ADMIN_PASSWORD}
super-admin.default.name=${SUPER_ADMIN_NAME}

# SMTP configuration
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true

# Cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.url=${CLOUDINARY_URL}

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2MB

# Cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=${CACHE_NAMES:events,users,teams,galleries}
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=1000,recordStats

# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,loggers
management.endpoint.health.show-components=always
management.endpoint.health.show-details=WHEN_AUTHORIZED
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.metrics.tags.application=${spring.application.name}

# Security headers
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.forward-headers-strategy=NATIVE

# Response compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Session management
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Common logging configuration
logging.level.root=INFO
logging.level.com.megatronix.paridhi=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# API rate limiting (via Spring Security)
resilience4j.ratelimiter.instances.default.limit-for-period=100
resilience4j.ratelimiter.instances.default.limit-refresh-period=1m
resilience4j.ratelimiter.instances.default.timeout-duration=0