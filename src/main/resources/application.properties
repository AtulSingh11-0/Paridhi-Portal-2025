spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.pool-name=ParidhiHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.register-mbeans=true

spring.application.name=${SPRING_APPLICATION_NAME}

app.base-url=${SPRING_APPLICATION_BASE_URL}

super-admin.default.email=${SUPER_ADMIN_EMAIL}
super-admin.default.password=${SUPER_ADMIN_PASSWORD}
super-admin.default.name=${SUPER_ADMIN_NAME}

# smtp configuration
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# cloudinary configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.url=${CLOUDINARY_URL}

# file upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=${CACHE_NAMES}
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=1000,recordStats

# enable monitoring with actuator
management.health.db.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-components=always
management.endpoint.health.show-details=WHEN_AUTHORIZED
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Security headers
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Response compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Rate limiting (managed by API Gateway)
server.servlet.session.timeout=30m