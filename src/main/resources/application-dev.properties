
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/${SPRING_APPLICATION_NAME}?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update

# Development-specific HikariCP settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}