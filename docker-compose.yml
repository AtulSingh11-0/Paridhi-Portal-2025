version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: paridhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: Paridhi-Portal-2025
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - paridhi-network

  app:
    image: ${DOCKER_USERNAME}/paridhi-portal-2025:latest
    container_name: paridhi-portal
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - paridhi-network

networks:
  paridhi-network:
    driver: bridge

volumes:
  mysql-data: